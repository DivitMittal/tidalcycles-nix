name: tidalcycles-nix
version: 1.0.0
description: Comprehensive home-manager module for TidalCycles live coding (Haskell, SuperCollider, SuperDirt)
author: DivitMittal
license: MIT
target: all
type: instructions

dependencies:
  mcp:
    - name: serena
      registry: false
      transport: stdio
      command: uvx
      args:
        - --from
        - git+https://github.com/oraios/serena
        - serena
        - start-mcp-server
        - --context
        - claude-code
        - --project
        - ~/Projects/Cfgs/tidalcycles-nix/
